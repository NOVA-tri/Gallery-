
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Hearts Gallery</title>
<style>
* {box-sizing:border-box;margin:0;padding:0}
body {
  font-family:Arial,sans-serif;
  background:#101018;color:white;
}
header {
  text-align:center;padding:45px 15px;
  background:linear-gradient(135deg,#202044,#101018);
}
header h1 {font-size:36px;letter-spacing:4px}
header p {color:#aaa;margin-top:12px}
.container {max-width:1100px;margin:auto;padding:25px}
.gallery {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}
.photo {
  overflow:hidden;border-radius:13px;
  cursor:pointer;background:#222;
}
.photo img {
  width:100%;height:210px;
  object-fit:cover;display:block;
  transition:.4s;
}
.photo:hover img {transform:scale(1.1)}
footer {
  text-align:center;padding:30px;
  color:#888;font-size:13px;
}
#viewer {
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.95);
  z-index:10;align-items:center;
  justify-content:center;flex-direction:column;
}
#viewer img {
  max-width:90%;max-height:75vh;
  border-radius:12px;
}
.close {
  position:absolute;top:20px;right:25px;
  font-size:35px;cursor:pointer;
}
.controls {display:flex;gap:30px;margin-top:20px}
.controls button {
  padding:12px 22px;border:0;border-radius:20px;
  background:#7357ff;color:white;cursor:pointer;
}
@media(max-width:700px) {
  .gallery {grid-template-columns:repeat(2,1fr)}
  .photo img {height:170px}
  header h1 {font-size:27px}
}
</style>
</head>
<body>

<header>
  <h1>✦ Two Hearts Gallery ✦</h1>
  <p>Eight Pictures, Endless Memories</p>
</header>

<div class="container">
  <div class="gallery" id="gallery"></div>
</div>

<div id="viewer">
  <span class="close" onclick="closeViewer()">×</span>
  <img id="bigImage">
  <div class="controls">
    <button onclick="change(-1)">❮ Previous</button>
    <button onclick="change(1)">Next ❯</button>
  </div>
</div>

<footer>
  © 2026 Two Hearts Gallery | All Memories Matter ♡
</footer>

<script>
const photos = [
 "IMG-20261105-WA0004.jpg",
 "IMG-20261122-WA0019.jpg",
 "lv_0_20261027074938.jpg",
 "IMG-20261122-WA0022.jpg",
 "https://images.unsplash.com/photo-1448375240586-882707db888b?w=800",
 "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800",
 "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800",
 "https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=800"
];

let current = 0;

const gallery = document.getElementById("gallery");

photos.forEach((src,i) => {
  gallery.innerHTML += `
    <div class="photo" onclick="openViewer(${i})">
      <img src="${src}" alt="Foto ${i+1}" loading="lazy">
    </div>`;
});

function openViewer(i) {
  current=i;
  showImage();
  document.getElementById("viewer").style.display="flex";
}

function showImage() {
  document.getElementById("bigImage").src=photos[current];
}

function change(step) {
  current=(current+step+photos.length)%photos.length;
  showImage();
}

function closeViewer() {
  document.getElementById("viewer").style.display="none";
}
</script>

</body>
</html>
